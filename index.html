<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sistema Solar WebAR</title>
    
    <!-- A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        /* Estilos para el mensaje de carga */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }
        
        #loading.hidden {
            display: none;
        }
        
        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            text-align: center;
            padding: 0 20px;
        }
        
        /* Indicador de estado AR */
        #arStatus {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <!-- Pantalla de carga -->
    <div id="loading">
        <div class="loading-text">
            <h2>Sistema Solar AR</h2>
            <p>Apunta tu cámara al código QR marcador</p>
            <p style="font-size: 14px; opacity: 0.8;">Permitir acceso a la cámara cuando se solicite</p>
        </div>
    </div>
    
    <!-- Indicador de estado -->
    <div id="arStatus">Iniciando AR...</div>
    
    <!-- Escena A-Frame con AR.js -->
    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: high; antialias: true; alpha: true;">
        
        <!-- Assets -->
        <a-assets>
            <!-- Modelo 3D del sistema solar -->
            <!-- <a-asset-item id="solarModel" src="modelo_solar.glb"></a-asset-item> -->
        </a-assets>
        
        <!-- Cámara AR -->
        <a-entity camera>
            <!-- Cursor para detección de clics/toques -->
            <a-entity 
                cursor="rayOrigin: mouse"
                raycaster="objects: .clickable">
            </a-entity>
        </a-entity>
        
        <!-- Marcador QR (pattern-qr.patt) -->
        <a-marker
            id="markerQR"
            type="pattern"
            preset="custom"
            url="pattern-qr.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="rayOrigin: mouse">
            
            <!-- Contenedor principal del sistema solar -->
            <a-entity id="solarSystem" position="0 0 0" scale="0.5 0.5 0.5">
                
                <!-- Modelo 3D del sistema solar -->
                <!-- <a-entity 
                    id="solarModel3D"
                    gltf-model="#solarModel"
                    position="0 0 0"
                    scale="1 1 1"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 100000; easing: linear">
                </a-entity> -->
                
                <!-- Representación alternativa con primitivas (mientras no tengamos el modelo GLB) -->
                <a-entity id="solarSystemPrimitives">
                    <!-- Sol -->
                    <a-sphere 
                        id="sun"
                        position="0 0 0" 
                        radius="0.8" 
                        color="#FDB813"
                        material="emissive: #FDB813; emissiveIntensity: 0.5">
                    </a-sphere>
                    
                    <!-- Órbitas de los planetas (líneas circulares) -->
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="1.5" radius-outer="1.52" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="2" radius-outer="2.02" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="2.7" radius-outer="2.72" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="3.5" radius-outer="3.52" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="5" radius-outer="5.02" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="6.5" radius-outer="6.52" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="7.5" radius-outer="7.52" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="8.5" radius-outer="8.52" color="#333" opacity="0.3"></a-ring>
                    
                    <!-- Planetas con animación orbital -->
                    <!-- Mercurio -->
                    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
                        <a-sphere position="1.5 0 0" radius="0.1" color="#8C7853"></a-sphere>
                    </a-entity>
                    
                    <!-- Venus -->
                    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear">
                        <a-sphere position="2 0 0" radius="0.15" color="#FFC649"></a-sphere>
                    </a-entity>
                    
                    <!-- Tierra -->
                    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
                        <a-sphere position="2.7 0 0" radius="0.15" color="#4169E1"></a-sphere>
                    </a-entity>
                    
                    <!-- Marte -->
                    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear">
                        <a-sphere position="3.5 0 0" radius="0.12" color="#CD5C5C"></a-sphere>
                    </a-entity>
                    
                    <!-- Júpiter -->
                    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 40000; easing: linear">
                        <a-sphere position="5 0 0" radius="0.35" color="#DAA520"></a-sphere>
                    </a-entity>
                    
                    <!-- Saturno -->
                    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 50000; easing: linear">
                        <a-sphere position="6.5 0 0" radius="0.3" color="#F4A460"></a-sphere>
                        <a-ring position="6.5 0 0" rotation="-20 0 0" radius-inner="0.4" radius-outer="0.55" color="#D2B48C"></a-ring>
                    </a-entity>
                    
                    <!-- Urano -->
                    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 60000; easing: linear">
                        <a-sphere position="7.5 0 0" radius="0.2" color="#4FD0E7"></a-sphere>
                    </a-entity>
                    
                    <!-- Neptuno -->
                    <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 70000; easing: linear">
                        <a-sphere position="8.5 0 0" radius="0.2" color="#4166F5"></a-sphere>
                    </a-entity>
                </a-entity>
                
                <!-- Esferas invisibles clickeables sobre cada planeta -->
                <!-- Estas esferas se posicionarán dinámicamente con JavaScript -->
                <a-sphere class="clickable" data-planet="mercury" position="1.5 0 0" radius="0.3" opacity="0" visible="true"></a-sphere>
                <a-sphere class="clickable" data-planet="venus" position="2 0 0" radius="0.3" opacity="0" visible="true"></a-sphere>
                <a-sphere class="clickable" data-planet="earth" position="2.7 0 0" radius="0.3" opacity="0" visible="true"></a-sphere>
                <a-sphere class="clickable" data-planet="mars" position="3.5 0 0" radius="0.3" opacity="0" visible="true"></a-sphere>
                <a-sphere class="clickable" data-planet="jupiter" position="5 0 0" radius="0.5" opacity="0" visible="true"></a-sphere>
                <a-sphere class="clickable" data-planet="saturn" position="6.5 0 0" radius="0.5" opacity="0" visible="true"></a-sphere>
                <a-sphere class="clickable" data-planet="uranus" position="7.5 0 0" radius="0.4" opacity="0" visible="true"></a-sphere>
                <a-sphere class="clickable" data-planet="neptune" position="8.5 0 0" radius="0.4" opacity="0" visible="true"></a-sphere>
                
                <!-- Panel de información (oculto por defecto) -->
                <a-entity id="infoPanel" visible="false" position="0 2 0">
                    <a-plane 
                        position="0 0 0" 
                        width="3" 
                        height="1.5" 
                        color="#000000"
                        opacity="0.8">
                    </a-plane>
                    <a-text 
                        id="planetName"
                        position="0 0.4 0.01" 
                        value="Planeta"
                        align="center"
                        color="#FFFFFF"
                        width="4"
                        font="kelsonsans">
                    </a-text>
                    <a-text 
                        id="planetInfo"
                        position="0 -0.1 0.01" 
                        value="Información del planeta"
                        align="center"
                        color="#FFFFFF"
                        width="2.5"
                        wrap-count="40"
                        font="kelsonsans">
                    </a-text>
                </a-entity>
                
            </a-entity>
        </a-marker>
    </a-scene>
    
    <script>
        // Base de datos de planetas con su información
        const planetsData = {
            mercury: {
                name: "Mercurio",
                info: "El planeta más pequeño y cercano al Sol. Un año en Mercurio dura solo 88 días terrestres.",
                position: { x: 1.5, y: 0, z: 0 },
                orbitDuration: 10000
            },
            venus: {
                name: "Venus",
                info: "El planeta más caliente del sistema solar. Su atmósfera atrapa el calor como un invernadero extremo.",
                position: { x: 2, y: 0, z: 0 },
                orbitDuration: 15000
            },
            earth: {
                name: "Tierra",
                info: "Nuestro hogar, el único planeta conocido con vida. El 71% de su superficie está cubierta de agua.",
                position: { x: 2.7, y: 0, z: 0 },
                orbitDuration: 20000
            },
            mars: {
                name: "Marte",
                info: "El planeta rojo. Tiene el volcán más alto del sistema solar: el Monte Olimpo con 21 km de altura.",
                position: { x: 3.5, y: 0, z: 0 },
                orbitDuration: 25000
            },
            jupiter: {
                name: "Júpiter",
                info: "El gigante del sistema solar. Su Gran Mancha Roja es una tormenta más grande que la Tierra.",
                position: { x: 5, y: 0, z: 0 },
                orbitDuration: 40000
            },
            saturn: {
                name: "Saturno",
                info: "Famoso por sus anillos espectaculares. Es tan ligero que flotaría en agua si hubiera un océano suficientemente grande.",
                position: { x: 6.5, y: 0, z: 0 },
                orbitDuration: 50000
            },
            uranus: {
                name: "Urano",
                info: "Gira de lado, con una inclinación de 98 grados. Sus estaciones duran 21 años terrestres cada una.",
                position: { x: 7.5, y: 0, z: 0 },
                orbitDuration: 60000
            },
            neptune: {
                name: "Neptuno",
                info: "El planeta con los vientos más rápidos del sistema solar, alcanzando hasta 2,100 km/h.",
                position: { x: 8.5, y: 0, z: 0 },
                orbitDuration: 70000
            }
        };
        
        // Variable para rastrear el planeta actualmente seleccionado
        let currentPlanet = null;
        
        // Función para mostrar información del planeta
        function showPlanetInfo(planetName) {
            const infoPanel = document.querySelector('#infoPanel');
            const nameText = document.querySelector('#planetName');
            const infoText = document.querySelector('#planetInfo');
            
            // Si se hace clic en el mismo planeta, ocultar el panel
            if (currentPlanet === planetName) {
                infoPanel.setAttribute('visible', false);
                currentPlanet = null;
                return;
            }
            
            // Obtener datos del planeta
            const planet = planetsData[planetName];
            if (!planet) return;
            
            // Actualizar textos
            nameText.setAttribute('value', planet.name);
            infoText.setAttribute('value', planet.info);
            
            // Posicionar el panel sobre el planeta
            // Calculamos la posición actual del planeta en su órbita
            const clickableSphere = document.querySelector(`[data-planet="${planetName}"]`);
            const position = clickableSphere.getAttribute('position');
            
            // Colocar el panel ligeramente arriba del planeta
            infoPanel.setAttribute('position', `${position.x} ${position.y + 1.5} ${position.z}`);
            
            // Mostrar el panel
            infoPanel.setAttribute('visible', true);
            
            // Actualizar el planeta actual
            currentPlanet = planetName;
        }
        
        // Función para actualizar las posiciones de las esferas clickeables
        function updateClickablePositions() {
            //TODO: Función para actualizar periódicamente las posiciones de las esferas invisibles según la rotación orbital
        }
        
        // Inicialización cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            // Configurar event listeners para cada esfera clickeable
            const clickableSpheres = document.querySelectorAll('.clickable');
            
            clickableSpheres.forEach(sphere => {
                sphere.addEventListener('click', function(event) {
                    event.stopPropagation();
                    const planetName = this.getAttribute('data-planet');
                    showPlanetInfo(planetName);
                    
                    // Feedback visual/auditivo opcional
                    console.log(`Planeta clickeado: ${planetName}`);
                });
            });
            
            // Click en el marcador para ocultar el panel si está visible
            const marker = document.querySelector('#markerQR');
            marker.addEventListener('click', function(event) {
                // Si el click no fue en una esfera clickeable, ocultar el panel
                if (!event.target.classList.contains('clickable')) {
                    const infoPanel = document.querySelector('#infoPanel');
                    infoPanel.setAttribute('visible', false);
                    currentPlanet = null;
                }
            });
            
            // Eventos del marcador para actualizar el estado
            marker.addEventListener('markerFound', function() {
                console.log('Marcador QR detectado');
                document.querySelector('#arStatus').textContent = '✓ Marcador detectado';
                document.querySelector('#arStatus').style.background = 'rgba(0, 128, 0, 0.7)';
                
                // Ocultar pantalla de carga
                document.querySelector('#loading').classList.add('hidden');
            });
            
            marker.addEventListener('markerLost', function() {
                console.log('Marcador QR perdido');
                document.querySelector('#arStatus').textContent = 'Buscando marcador...';
                document.querySelector('#arStatus').style.background = 'rgba(255, 165, 0, 0.7)';
                
                // Ocultar panel de información si está visible
                const infoPanel = document.querySelector('#infoPanel');
                infoPanel.setAttribute('visible', false);
                currentPlanet = null;
            });
            
            // Configuración inicial completada
            setTimeout(() => {
                document.querySelector('#loading').classList.add('hidden');
                document.querySelector('#arStatus').textContent = '📷 Apunta al código QR';
            }, 3000);
        });
        
        // Manejo de errores de cámara
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                console.log('Cámara iniciada correctamente');
            })
            .catch(function(err) {
                console.error('Error al acceder a la cámara:', err);
                document.querySelector('#arStatus').textContent = 'Error de cámara';
                document.querySelector('#arStatus').style.background = 'rgba(255, 0, 0, 0.7)';
            });
        
        // Optimización para móviles: ajustar la escala según el dispositivo
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            console.log('Dispositivo móvil detectado - Optimizando experiencia');
            
            // Ajustar escala para mejor visualización en móviles
            const solarSystem = document.querySelector('#solarSystem');
            solarSystem.setAttribute('scale', '0.3 0.3 0.3');
        }
    </script>
</body>
</html>
