<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sistema Solar WebAR</title>

    <!-- A-Frame y AR.js - Versiones estables y compatibles -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Pantalla de carga */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            text-align: center;
            padding: 0 20px;
        }

        .loading-text h2 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        .loading-text p {
            font-size: 14px;
            opacity: 0.9;
            margin: 5px 0;
        }

        /* Indicador de estado AR */
        #arStatus {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffa500;
            animation: pulse 2s infinite;
        }

        .status-dot.active {
            background: #00ff00;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Panel de información */
        #infoOverlay {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            max-width: 90%;
            text-align: center;
            z-index: 200;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #infoOverlay.visible {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translate(-50%, 100px);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }

        #infoOverlay h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #4da6ff;
        }

        #infoOverlay p {
            margin: 0;
            font-size: 13px;
            line-height: 1.4;
        }

        /* Controles */
        #controls {
            position: fixed;
            top: 50px;
            left: 10px;
            z-index: 101;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }

        /* Instrucciones */
        #instructions {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 11px;
            z-index: 99;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Pantalla de carga -->
    <div id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">
            <h2>Sistema Solar AR</h2>
            <p>Preparando experiencia...</p>
            <p style="font-size: 12px; opacity: 0.7; margin-top: 10px;">
                Por favor, permite el acceso a la cámara
            </p>
        </div>
    </div>

    <!-- Indicador de estado -->
    <div id="arStatus">
        <div class="status-dot"></div>
        <span>Iniciando AR...</span>
    </div>
    
    <!-- Controles -->
    <div id="controls">
        <button class="control-btn" id="resetBtn">🔄 Resetear</button>
        <button class="control-btn" id="infoBtn">ℹ️ Info</button>
    </div>

    <!-- Panel de información overlay -->
    <div id="infoOverlay">
        <h3 id="overlayTitle">Planeta</h3>
        <p id="overlayText">Información del planeta</p>
    </div>

    <!-- Instrucciones -->
    <div id="instructions">
        Toca un planeta para ver información
    </div>

    <!-- Escena A-Frame con AR.js -->
    <a-scene
        embedded
        arjs="sourceType: webcam; 
              debugUIEnabled: false; 
              detectionMode: mono_and_matrix; 
              matrixCodeType: 3x3;
              patternRatio: 0.75;
              trackingMethod: best;"
        vr-mode-ui="enabled: false"
        renderer="antialias: true; 
                  alpha: true; 
                  logarithmicDepthBuffer: true;
                  colorManagement: true;
                  sortObjects: true;"
        stats="false">

        <!-- Cámara AR -->
        <a-entity camera></a-entity>

        <!-- Marcador Pattern -->
        <a-marker 
            id="marker"
            type="pattern" 
            url="pattern-qr.patt"
            smooth="true"
            smoothCount="5"
            smoothTolerance="0.01"
            smoothThreshold="5">

            <!-- Contenedor del Sistema Solar -->
            <a-entity id="solarSystem" scale="0.5 0.5 0.5">

                <!-- Sol central -->
                <a-sphere 
                    id="sun"
                    radius="0.7"
                    color="#FDB813"
                    emissive="#FFA000"
                    emissiveIntensity="0.5">
                    <a-animation
                        attribute="rotation"
                        to="0 360 0"
                        dur="20000"
                        repeat="indefinite"
                        easing="linear">
                    </a-animation>
                </a-sphere>

                <!-- Luz del sol -->
                <a-light type="point" color="#FFF5E6" intensity="0.5" position="0 0 0"></a-light>
                <a-light type="ambient" color="#404040" intensity="0.3"></a-light>

                <!-- Órbitas visuales -->
                <a-ring rotation="-90 0 0" radius-inner="1.2" radius-outer="1.25" color="#333333" opacity="0.4"></a-ring>
                <a-ring rotation="-90 0 0" radius-inner="1.7" radius-outer="1.75" color="#333333" opacity="0.4"></a-ring>
                <a-ring rotation="-90 0 0" radius-inner="2.3" radius-outer="2.35" color="#333333" opacity="0.4"></a-ring>
                <a-ring rotation="-90 0 0" radius-inner="3.0" radius-outer="3.05" color="#333333" opacity="0.4"></a-ring>

                <!-- Mercurio -->
                <a-entity id="mercuryOrbit" rotation="0 0 0">
                    <a-animation
                        attribute="rotation"
                        to="0 360 0"
                        dur="8000"
                        repeat="indefinite"
                        easing="linear">
                    </a-animation>
                    <a-sphere 
                        id="mercury"
                        class="planet"
                        position="1.2 0 0"
                        radius="0.08"
                        color="#8C7853"
                        data-name="Mercurio"
                        data-info="El planeta más pequeño y cercano al Sol. Tarda 88 días en dar una vuelta completa.">
                    </a-sphere>
                </a-entity>

                <!-- Venus -->
                <a-entity id="venusOrbit" rotation="0 0 0">
                    <a-animation
                        attribute="rotation"
                        to="0 360 0"
                        dur="12000"
                        repeat="indefinite"
                        easing="linear">
                    </a-animation>
                    <a-sphere 
                        id="venus"
                        class="planet"
                        position="1.7 0 0"
                        radius="0.14"
                        color="#FFC649"
                        data-name="Venus"
                        data-info="El planeta más caliente del sistema solar debido a su densa atmósfera.">
                    </a-sphere>
                </a-entity>

                <!-- Tierra -->
                <a-entity id="earthOrbit" rotation="0 0 0">
                    <a-animation
                        attribute="rotation"
                        to="0 360 0"
                        dur="15000"
                        repeat="indefinite"
                        easing="linear">
                    </a-animation>
                    <a-sphere 
                        id="earth"
                        class="planet"
                        position="2.3 0 0"
                        radius="0.15"
                        color="#4169E1"
                        data-name="Tierra"
                        data-info="Nuestro hogar, el único planeta conocido que alberga vida.">
                        <!-- Luna -->
                        <a-entity rotation="0 0 0">
                            <a-animation
                                attribute="rotation"
                                to="0 360 0"
                                dur="2000"
                                repeat="indefinite"
                                easing="linear">
                            </a-animation>
                            <a-sphere position="0.25 0 0" radius="0.03" color="#C0C0C0"></a-sphere>
                        </a-entity>
                    </a-sphere>
                </a-entity>

                <!-- Marte -->
                <a-entity id="marsOrbit" rotation="0 0 0">
                    <a-animation
                        attribute="rotation"
                        to="0 360 0"
                        dur="20000"
                        repeat="indefinite"
                        easing="linear">
                    </a-animation>
                    <a-sphere 
                        id="mars"
                        class="planet"
                        position="3.0 0 0"
                        radius="0.11"
                        color="#CD5C5C"
                        data-name="Marte"
                        data-info="El planeta rojo. Tiene el volcán más alto del sistema solar: el Monte Olimpo.">
                    </a-sphere>
                </a-entity>

            </a-entity>
        </a-marker>
    </a-scene>

    <script>
        // Variables globales
        let markerVisible = false;
        let currentPlanet = null;

        // Función para mostrar información del planeta
        function showPlanetInfo(planetEl) {
            const name = planetEl.getAttribute('data-name');
            const info = planetEl.getAttribute('data-info');
            
            const overlay = document.getElementById('infoOverlay');
            document.getElementById('overlayTitle').textContent = name;
            document.getElementById('overlayText').textContent = info;
            
            overlay.classList.add('visible');
            currentPlanet = name;
            
            // Ocultar después de 5 segundos
            setTimeout(() => {
                overlay.classList.remove('visible');
            }, 5000);
        }

        // Inicialización
        window.addEventListener('load', function() {
            const scene = document.querySelector('a-scene');
            const marker = document.querySelector('#marker');
            const loading = document.getElementById('loading');
            const arStatus = document.getElementById('arStatus');
            const statusDot = document.querySelector('.status-dot');
            const statusText = arStatus.querySelector('span');
            const instructions = document.getElementById('instructions');

            // Configurar la escena
            if (scene.hasLoaded) {
                onSceneLoaded();
            } else {
                scene.addEventListener('loaded', onSceneLoaded);
            }

            function onSceneLoaded() {
                console.log('Escena AR cargada');
                
                // Ocultar pantalla de carga
                setTimeout(() => {
                    loading.classList.add('hidden');
                    statusText.textContent = 'Buscando marcador...';
                    instructions.style.display = 'none'; // Ocultar por ahora
                }, 2000);

                // Configurar clicks en planetas
                const planets = document.querySelectorAll('.planet');
                planets.forEach(planet => {
                    planet.addEventListener('click', function() {
                        if (markerVisible) {
                            showPlanetInfo(this);
                        }
                    });
                });

                // Para dispositivos táctiles
                scene.addEventListener('click', function(evt) {
                    if (!markerVisible) return;
                    
                    if (evt.detail && evt.detail.intersection) {
                        const el = evt.detail.intersection.object.el;
                        if (el && el.classList.contains('planet')) {
                            showPlanetInfo(el);
                        }
                    }
                });
            }

            // Eventos del marcador
            marker.addEventListener('markerFound', function() {
                console.log('Marcador detectado');
                markerVisible = true;
                statusDot.classList.add('active');
                statusText.textContent = 'Sistema Solar activo';
                instructions.style.display = 'block';
            });

            marker.addEventListener('markerLost', function() {
                console.log('Marcador perdido');
                markerVisible = false;
                statusDot.classList.remove('active');
                statusText.textContent = 'Buscando marcador...';
                instructions.style.display = 'none';
                document.getElementById('infoOverlay').classList.remove('visible');
            });

            // Botón de reset
            document.getElementById('resetBtn').addEventListener('click', function() {
                const solarSystem = document.getElementById('solarSystem');
                solarSystem.setAttribute('scale', '0.5 0.5 0.5');
                solarSystem.setAttribute('rotation', '0 0 0');
                document.getElementById('infoOverlay').classList.remove('visible');
            });

            // Botón de información
            document.getElementById('infoBtn').addEventListener('click', function() {
                const overlay = document.getElementById('infoOverlay');
                document.getElementById('overlayTitle').textContent = 'Sistema Solar AR';
                document.getElementById('overlayText').textContent = 'Apunta tu cámara al marcador QR para ver el sistema solar en realidad aumentada. Toca los planetas para conocer más sobre ellos.';
                overlay.classList.add('visible');
                
                setTimeout(() => {
                    overlay.classList.remove('visible');
                }, 4000);
            });

            // Optimización para móviles
            if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                console.log('Dispositivo móvil detectado');
                
                // Ajustar escala
                const solarSystem = document.getElementById('solarSystem');
                
                // Para pantallas pequeñas
                if (window.innerWidth < 768) {
                    solarSystem.setAttribute('scale', '0.4 0.4 0.4');
                }
                
                // Prevenir zoom accidental
                document.addEventListener('gesturestart', function(e) {
                    e.preventDefault();
                });
                
                // Mejorar respuesta táctil
                let touchTimeout;
                scene.canvas.addEventListener('touchstart', function(e) {
                    touchTimeout = setTimeout(() => {
                        const touch = e.touches[0];
                        const clickEvent = new MouseEvent('click', {
                            view: window,
                            bubbles: true,
                            cancelable: true,
                            clientX: touch.clientX,
                            clientY: touch.clientY
                        });
                        e.target.dispatchEvent(clickEvent);
                    }, 100);
                });
                
                scene.canvas.addEventListener('touchend', function() {
                    clearTimeout(touchTimeout);
                });
            }

            // Manejar errores de cámara
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    console.log('Cámara iniciada correctamente');
                    stream.getTracks().forEach(track => track.stop());
                })
                .catch(function(err) {
                    console.error('Error de cámara:', err);
                    loading.querySelector('.loading-text').innerHTML = 
                        '<h2>Error de Cámara</h2><p>No se pudo acceder a la cámara. Por favor, verifica los permisos.</p>';
                });
        });

        // Manejo de visibilidad de página
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                console.log('App en segundo plano');
            } else {
                console.log('App activa');
            }
        });
    </script>
</body>

</html>
