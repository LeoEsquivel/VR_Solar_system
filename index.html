<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sistema Solar WebAR</title>

    <!-- A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Estilos para el mensaje de carga */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }

        #loading.hidden {
            display: none;
        }

        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            text-align: center;
            padding: 0 20px;
        }

        /* Indicador de estado AR */
        #arStatus {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }
        
        /* Botón de debug para móviles */
        #debugButton {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 100, 200, 0.8);
            color: white;
            padding: 15px;
            border-radius: 50%;
            font-size: 12px;
            z-index: 1000;
            /* display: none; */
        }
    </style>
</head>

<body>
    <!-- Pantalla de carga -->
    <div id="loading">
        <div class="loading-text">
            <h2>Sistema Solar AR</h2>
            <p>Apunta tu cámara al código QR marcador</p>
            <p style="font-size: 14px; opacity: 0.8;">Permitir acceso a la cámara cuando se solicite</p>
        </div>
    </div>

    <!-- Indicador de estado -->
    <div id="arStatus">Iniciando AR...</div>
    
    <!-- Botón de debug para testing en móviles -->
    <div id="debugButton">Test</div>

    <!-- Escena A-Frame con AR.js -->
    <a-scene embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: high; antialias: true; alpha: true;">

        <!-- Assets con texturas alternativas y colores de respaldo -->
        <a-assets timeout="30000">
        </a-assets>

        <!-- Cámara AR con cursor mejorado para móviles -->
        <a-entity camera>
            <!-- Cursor mejorado para touch y mouse -->
            <a-entity 
                cursor="fuse: false; rayOrigin: mouse"
                raycaster="objects: .clickable; far: 100">
            </a-entity>
        </a-entity>

        <!-- Marcador QR (pattern-qr.patt) -->
        <a-marker id="markerQR" type="pattern" preset="custom" url="pattern-qr.patt"
            emitevents="true">

            <!-- Contenedor principal del sistema solar -->
            <a-entity id="solarSystem" position="0 0 0" scale="0.5 0.5 0.5">

                <!-- Sistema Solar con texturas mejoradas y colores de respaldo -->
                <a-entity id="solarSystemPrimitives">
                    <!-- Sol con emisión mejorada -->
                    <a-sphere id="sun" position="0 0 0" radius="0.8"
                        material="color: #FDB813; emissive: #FFA000; emissiveIntensity: 0.8; shader: standard">
                        <!-- Luz del sol -->
                        <a-light type="point" color="#FFF5E1" intensity="0.5"></a-light>
                    </a-sphere>

                    <!-- Órbitas -->
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="1.5" radius-outer="1.52" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="2" radius-outer="2.02" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="2.7" radius-outer="2.72" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="3.5" radius-outer="3.52" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="5" radius-outer="5.02" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="6.5" radius-outer="6.52" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="7.5" radius-outer="7.52" color="#333" opacity="0.3"></a-ring>
                    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="8.5" radius-outer="8.52" color="#333" opacity="0.3"></a-ring>

                    <!-- Mercurio -->
                    <a-entity id="mercuryOrbit" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
                        <a-sphere position="1.5 0 0" radius="0.1" 
                            material="color: #8C7853; roughness: 0.8; metalness: 0.1"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
                        </a-sphere>
                        <!-- Esfera clickeable para Mercurio -->
                        <a-sphere class="clickable" data-planet="mercury" position="1.5 0 0" radius="0.25" 
                            material="opacity: 0.01; transparent: true" visible="true"></a-sphere>
                    </a-entity>

                    <!-- Venus -->
                    <a-entity id="venusOrbit" animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear">
                        <a-sphere position="2 0 0" radius="0.15" 
                            material="color: #FFC649; roughness: 0.6; metalness: 0.2"
                            animation="property: rotation; to: 0 -360 0; loop: true; dur: 8000">
                        </a-sphere>
                        <!-- Esfera clickeable para Venus -->
                        <a-sphere class="clickable" data-planet="venus" position="2 0 0" radius="0.3" 
                            material="opacity: 0.01; transparent: true" visible="true"></a-sphere>
                    </a-entity>

                    <!-- Tierra -->
                    <a-entity id="earthOrbit" animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
                        <a-sphere position="2.7 0 0" radius="0.15" 
                            material="color: #4169E1; roughness: 0.5; metalness: 0.1"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
                        </a-sphere>
                        <!-- Luna -->
                        <a-entity position="2.7 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 2000">
                            <a-sphere position="0.25 0 0" radius="0.04" material="color: #C0C0C0"></a-sphere>
                        </a-entity>
                        <!-- Esfera clickeable para Tierra -->
                        <a-sphere class="clickable" data-planet="earth" position="2.7 0 0" radius="0.3" 
                            material="opacity: 0.01; transparent: true" visible="true"></a-sphere>
                    </a-entity>

                    <!-- Marte -->
                    <a-entity id="marsOrbit" animation="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear">
                        <a-sphere position="3.5 0 0" radius="0.12" 
                            material="color: #CD5C5C; roughness: 0.9; metalness: 0.1"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 3500">
                        </a-sphere>
                        <!-- Esfera clickeable para Marte -->
                        <a-sphere class="clickable" data-planet="mars" position="3.5 0 0" radius="0.3" 
                            material="opacity: 0.01; transparent: true" visible="true"></a-sphere>
                    </a-entity>

                    <!-- Júpiter -->
                    <a-entity id="jupiterOrbit" animation="property: rotation; to: 0 360 0; loop: true; dur: 40000; easing: linear">
                        <a-sphere position="5 0 0" radius="0.35" 
                            material="color: #DAA520; roughness: 0.5; metalness: 0.2"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 2000">
                        </a-sphere>
                        <!-- Esfera clickeable para Júpiter -->
                        <a-sphere class="clickable" data-planet="jupiter" position="5 0 0" radius="0.5" 
                            material="opacity: 0.01; transparent: true" visible="true"></a-sphere>
                    </a-entity>

                    <!-- Saturno -->
                    <a-entity id="saturnOrbit" animation="property: rotation; to: 0 360 0; loop: true; dur: 50000; easing: linear">
                        <a-sphere position="6.5 0 0" radius="0.3" 
                            material="color: #F4A460; roughness: 0.6; metalness: 0.1"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 2500">
                        </a-sphere>
                        <a-ring position="6.5 0 0" rotation="-20 0 0" radius-inner="0.4" radius-outer="0.55" 
                            material="color: #D2B48C; side: double; opacity: 0.8"></a-ring>
                        <!-- Esfera clickeable para Saturno -->
                        <a-sphere class="clickable" data-planet="saturn" position="6.5 0 0" radius="0.5" 
                            material="opacity: 0.01; transparent: true" visible="true"></a-sphere>
                    </a-entity>

                    <!-- Urano -->
                    <a-entity id="uranusOrbit" animation="property: rotation; to: 0 360 0; loop: true; dur: 60000; easing: linear">
                        <a-sphere position="7.5 0 0" radius="0.2" 
                            material="color: #4FD0E7; roughness: 0.4; metalness: 0.3"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
                        </a-sphere>
                        <!-- Esfera clickeable para Urano -->
                        <a-sphere class="clickable" data-planet="uranus" position="7.5 0 0" radius="0.4" 
                            material="opacity: 0.01; transparent: true" visible="true"></a-sphere>
                    </a-entity>

                    <!-- Neptuno -->
                    <a-entity id="neptuneOrbit" animation="property: rotation; to: 0 360 0; loop: true; dur: 70000; easing: linear">
                        <a-sphere position="8.5 0 0" radius="0.2" 
                            material="color: #4166F5; roughness: 0.3; metalness: 0.4"
                            animation="property: rotation; to: 0 360 0; loop: true; dur: 4500">
                        </a-sphere>
                        <!-- Esfera clickeable para Neptuno -->
                        <a-sphere class="clickable" data-planet="neptune" position="8.5 0 0" radius="0.4" 
                            material="opacity: 0.01; transparent: true" visible="true"></a-sphere>
                    </a-entity>
                </a-entity>

                <!-- Panel de información mejorado -->
                <a-entity id="infoPanel" visible="false" position="0 2 0" look-at="[camera]">
                    <a-plane position="0 0 0" width="3" height="1.5" 
                        material="color: #000000; opacity: 0.85; shader: flat">
                    </a-plane>
                    <a-text id="planetName" position="0 0.4 0.01" value="Planeta" align="center" 
                        color="#FFFFFF" width="5" font="kelsonsans">
                    </a-text>
                    <a-text id="planetInfo" position="0 -0.1 0.01" value="Información del planeta" 
                        align="center" color="#FFFFFF" width="2.8" wrap-count="45" font="kelsonsans">
                    </a-text>
                </a-entity>

            </a-entity>
        </a-marker>
    </a-scene>

    <script>
        // Registrar componente personalizado para manejar clicks en móviles
        AFRAME.registerComponent('planet-click-handler', {
            init: function() {
                const el = this.el;
                
                // Manejar tanto click como touch
                el.addEventListener('click', function(evt) {
                    const planetName = el.getAttribute('data-planet');
                    if (planetName) {
                        showPlanetInfo(planetName);
                        console.log('Click detectado en:', planetName);
                    }
                });
            }
        });

        // Base de datos de planetas con su información
        const planetsData = {
            mercury: {
                name: "Mercurio",
                info: "El planeta más pequeño y cercano al Sol. Un año en Mercurio dura solo 88 días terrestres.",
                color: "#8C7853"
            },
            venus: {
                name: "Venus",
                info: "El planeta más caliente del sistema solar. Su atmósfera atrapa el calor como un invernadero extremo.",
                color: "#FFC649"
            },
            earth: {
                name: "Tierra",
                info: "Nuestro hogar, el único planeta conocido con vida. El 71% de su superficie está cubierta de agua.",
                color: "#4169E1"
            },
            mars: {
                name: "Marte",
                info: "El planeta rojo. Tiene el volcán más alto del sistema solar: el Monte Olimpo con 21 km de altura.",
                color: "#CD5C5C"
            },
            jupiter: {
                name: "Júpiter",
                info: "El gigante del sistema solar. Su Gran Mancha Roja es una tormenta más grande que la Tierra.",
                color: "#DAA520"
            },
            saturn: {
                name: "Saturno",
                info: "Famoso por sus anillos. Es tan ligero que flotaría en agua si hubiera un océano lo suficientemente grande.",
                color: "#F4A460"
            },
            uranus: {
                name: "Urano",
                info: "Gira de lado, con una inclinación de 98 grados. Sus estaciones duran 21 años terrestres cada una.",
                color: "#4FD0E7"
            },
            neptune: {
                name: "Neptuno",
                info: "El planeta con los vientos más rápidos del sistema solar, alcanzando hasta 2,100 km/h.",
                color: "#4166F5"
            }
        };

        // Variable para rastrear el planeta actualmente seleccionado
        let currentPlanet = null;
        let markerVisible = false;

        // Función para mostrar información del planeta
        function showPlanetInfo(planetName) {
            const infoPanel = document.querySelector('#infoPanel');
            const nameText = document.querySelector('#planetName');
            const infoText = document.querySelector('#planetInfo');

            // Si se hace clic en el mismo planeta, ocultar el panel
            if (currentPlanet === planetName) {
                infoPanel.setAttribute('visible', false);
                currentPlanet = null;
                return;
            }

            // Obtener datos del planeta
            const planet = planetsData[planetName];
            if (!planet) return;

            // Actualizar textos
            nameText.setAttribute('value', planet.name);
            infoText.setAttribute('value', planet.info);

            // Obtener la órbita del planeta para posición dinámica
            const orbitEntity = document.querySelector(`#${planetName}Orbit`);
            if (orbitEntity) {
                const worldPos = new THREE.Vector3();
                orbitEntity.object3D.getWorldPosition(worldPos);
                
                // Posicionar el panel sobre el planeta
                infoPanel.setAttribute('position', `${worldPos.x} ${worldPos.y + 1.5} ${worldPos.z}`);
            }

            // Mostrar el panel
            infoPanel.setAttribute('visible', true);
            
            // Actualizar el planeta actual
            currentPlanet = planetName;
        }

        // Función para manejar touch en dispositivos móviles
        function setupMobileInteraction() {
            const scene = document.querySelector('a-scene');
            const canvas = scene.canvas;
            
            if (!canvas) {
                setTimeout(setupMobileInteraction, 100);
                return;
            }

            // Agregar manejador de touch events
            canvas.addEventListener('touchstart', function(e) {
                // Simular un click event para A-Frame
                const clickEvent = new MouseEvent('click', {
                    view: window,
                    bubbles: true,
                    cancelable: true,
                    clientX: e.touches[0].clientX,
                    clientY: e.touches[0].clientY
                });
                canvas.dispatchEvent(clickEvent);
            });
        }

        // Función para actualizar posiciones de esferas clickeables dinámicamente
        function updateClickableSpheres() {
            if (!markerVisible) return;
            
            Object.keys(planetsData).forEach(planetName => {
                const orbitEntity = document.querySelector(`#${planetName}Orbit`);
                const clickableSphere = document.querySelector(`[data-planet="${planetName}"]`);
                
                if (orbitEntity && clickableSphere) {
                    // Obtener la primera esfera hija (el planeta visual)
                    const planetSphere = orbitEntity.querySelector('a-sphere:not(.clickable)');
                    if (planetSphere) {
                        const position = planetSphere.getAttribute('position');
                        
                        // Calcular la posición mundial del planeta
                        const worldMatrix = orbitEntity.object3D.matrixWorld;
                        const pos = new THREE.Vector3(position.x, position.y, position.z);
                        pos.applyMatrix4(worldMatrix);
                        
                        // Actualizar posición de la esfera clickeable
                        clickableSphere.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
                    }
                }
            });
            
            // Actualizar posición del panel si está visible
            if (currentPlanet && infoPanel.getAttribute('visible')) {
                const orbitEntity = document.querySelector(`#${currentPlanet}Orbit`);
                if (orbitEntity) {
                    const worldPos = new THREE.Vector3();
                    orbitEntity.object3D.getWorldPosition(worldPos);
                    infoPanel.setAttribute('position', `${worldPos.x} ${worldPos.y + 1.5} ${worldPos.z}`);
                }
            }
        }

        // Inicialización cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function () {
            const scene = document.querySelector('a-scene');
            const infoPanel = document.querySelector('#infoPanel');
            
            // Esperar a que la escena esté cargada
            scene.addEventListener('loaded', function() {
                console.log('Escena A-Frame cargada');
                
                // Aplicar el componente a todas las esferas clickeables
                document.querySelectorAll('.clickable').forEach(sphere => {
                    sphere.setAttribute('planet-click-handler', '');
                });
                
                // Configurar interacción móvil
                setupMobileInteraction();
                
                // Actualizar posiciones dinámicamente
                setInterval(updateClickableSpheres, 50);
            });

            // Click en el marcador para ocultar el panel si está visible
            const marker = document.querySelector('#markerQR');
            
            marker.addEventListener('markerFound', function () {
                console.log('Marcador QR detectado');
                markerVisible = true;
                document.querySelector('#arStatus').textContent = '✓ Sistema Solar Activo';
                document.querySelector('#arStatus').style.background = 'rgba(0, 128, 0, 0.7)';
                document.querySelector('#loading').classList.add('hidden');
            });

            marker.addEventListener('markerLost', function () {
                console.log('Marcador QR perdido');
                markerVisible = false;
                document.querySelector('#arStatus').textContent = '⚠ Buscando marcador...';
                document.querySelector('#arStatus').style.background = 'rgba(255, 165, 0, 0.7)';
                
                // Ocultar panel de información
                infoPanel.setAttribute('visible', false);
                currentPlanet = null;
            });

            // Manejo de errores
            scene.addEventListener('arjs-video-error', (e) => {
                console.error("Error de video AR:", e);
                const loadingDiv = document.querySelector('#loading');
                const loadingText = loadingDiv.querySelector('.loading-text');
                loadingText.innerHTML = `<h2>Error</h2><p>No se pudo acceder a la cámara. Verifica los permisos.</p>`;
            });

            // Configuración inicial completada
            setTimeout(() => {
                const loadingDiv = document.querySelector('#loading');
                if (!loadingDiv.classList.contains('hidden')) {
                    loadingDiv.classList.add('hidden');
                    document.querySelector('#arStatus').textContent = '📷 Apunta al código QR';
                }
            }, 5000);
            
            const debugButton = document.querySelector('#debugButton');
            debugButton.addEventListener('click', function() {
                // Ciclar por los planetas para testing
                const planets = Object.keys(planetsData);
                const randomPlanet = planets[Math.floor(Math.random() * planets.length)];
                showPlanetInfo(randomPlanet);
            });
        });

        // Optimización para móviles
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            console.log('Dispositivo móvil detectado - Optimizando experiencia');
            
            const solarSystem = document.querySelector('#solarSystem');
            solarSystem.setAttribute('scale', '0.3 0.3 0.3');
            
            // Mostrar botón de debug en móviles para testing
            // document.querySelector('#debugButton').style.display = 'block';
        }
    </script>
</body>

</html>
